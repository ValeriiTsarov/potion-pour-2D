    <script>
        // Boot error catcher: show errors on screen (mobile has no console). Watchdog: game.ts sets __booted.
        (function () {
            function show(msg) {
                var d = document.getElementById('boot-err');
                if (!d) {
                    d = document.createElement('div');
                    d.id = 'boot-err';
                    d.style.cssText = 'position:fixed;left:0;right:0;top:0;padding:12px;background:#a00;color:#fff;font:14px monospace;white-space:pre-wrap;z-index:9999';
                    (document.body || document.documentElement).appendChild(d);
                }
                d.textContent += msg + '\n';
            }
            // "Script error." = a cross-origin script (portal SDK, ads): no file, no line, nothing to fix (Antfall, Y8 review 17.11).
            window.onerror = function (m, src, line) { if (/^Script error\.?$/.test(m) && !src) return; show('Error: ' + m + ' (' + src + ':' + line + ')'); };
            // Capture phase: resource load errors (<script>/<img>) don't bubble and never reach onerror.
            window.addEventListener('error', function (e) {
                var t = e.target;
                if (t && t !== window && (t.src || t.href)) show('Failed to load: ' + (t.src || t.href));
            }, true);
            window.addEventListener('unhandledrejection', function (e) { show('Promise: ' + (e.reason && e.reason.message || e.reason)); });
            setTimeout(function () { if (!window.__booted) show('Game did not start in 20 s. Try reloading.'); }, 20000);
            // Space / arrows must not scroll a portal host page. After boot Phaser's keyboard captures do it:
            // Phaser ignores events that are already defaultPrevented, so we must step aside.
            window.addEventListener('keydown', function (e) {
                if (window.__booted) return;
                if (e.code === 'Space' || e.code.indexOf('Arrow') === 0) e.preventDefault();
            });
        })();
    </script>

43E\u0432\u0438\u0449\u0430. \u0410\u043D\u0456 \u043E\u043F\u0456\u043A\u0443 \u0437\u0430 \u0432\u0441\u0435 \u043B\u0456\u0442\u043E!"],["\u0426\u0456\u0454\u0457 \u043D\u043E\u0447\u0456 \u0436\u043E\u0434\u043D\u0438\u0445 \u0441\u0442\u0440\u0430\u0448\u043D\u0438\u0445 \u0441\u043D\u0456\u0432 \u2014 \u043B\u0438\u0448\u0435 \u0437\u043E\u0440\u0456 \u0439 \u0442\u0438\u0448\u0430. \u0414\u044F\u043A\u0443\u044E.","\u0422\u0435\u043F\u0435\u0440 \u043F\u0456\u0441\u043B\u044F \u043A\u043E\u0436\u043D\u043E\u0457 \u0432\u0430\u0440\u0442\u0438 \u0441\u043F\u043B\u044E \u0441\u043E\u043B\u043E\u0434\u043A\u043E. \u0423\u0441\u044F \u0432\u0443\u043B\u0438\u0446\u044F \u0432\u0456\u0434 \u0442\u043E\u0433\u043E \u0441\u043F\u043E\u043A\u0456\u0439\u043D\u0456\u0448\u0430!"],["\u0416\u0430\u0440 \u043C\u0438\u043D\u0443\u0432, \u0456 \u043C\u043E\u044F \u043A\u0443\u0437\u043D\u044F \u0437\u043D\u043E\u0432\u0443 \u0442\u0435\u043F\u043B\u0430! \u0414\u044F\u043A\u0443\u044E.","\u042F \u0432\u0438\u043A\u0443\u0432\u0430\u043B\u0430 \u0432\u0430\u043C \u0433\u0430\u0447\u043E\u043A \u0434\u043B\u044F \u0442\u0440\u0430\u0432. \u041C\u0456\u0446\u043D\u0438\u0439, \u044F\u043A \u043C\u043E\u0454 \u043D\u043E\u0432\u0435 \u0437\u0434\u043E\u0440\u043E\u0432'\u044F!"]]},de:{title:"FREUNDSCHAFT",ask:"Und bitte noch etwas dazu: {herb}!",more:"Du geh\xF6rst schon fast zur Familie. Bitte nimm das!",ch:[["Endlich bis zum Morgen durchgeschlafen! Ich komme wieder.","Jetzt schlafe ich wie eine Katze am Ofen. Niemand braut so gut wie du!"],["Meine Augen tun nicht mehr weh \u2013 ich lese wieder meine Briefe! Danke.","Jetzt n\xE4he ich sogar bei Kerzenlicht. Meine Tochter bekommt ein neues Kleid!"],["Die Farben sind zur\xFCck! Sogar der Regen ist heute sch\xF6n.","Hier ist ein Bild von deinem Laden, mit allen Blumen. Es h\xE4ngt jetzt an meiner T\xFCr."],["Die ganze Nacht kein Husten! Meine Familie dankt dir.","Am Sonntag habe ich im Chor gesungen \u2013 ganz ohne Husten! Alle fragen nach dir."],["Zum ersten Mal seit Langem bin ich ruhig. Was f\xFCr ein sch\xF6ner Laden.","Ich habe bei der Stadtversammlung gesprochen, ohne zu zittern! Danke, Freund."],["Ich habe wieder Kraft f\xFCr die Reise! Ich bringe dir Geschichten aus der Ferne mit.","Mit deiner Tinktur bin ich \xFCber die Berge. Hier, Samen von der anderen Seite!"],["Mein Herz ist schon leichter. Vielleicht schreibe ich einen neuen Brief\u2026","Er hat geantwortet! Wir gehen zusammen auf den Jahrmarkt. Danke!"],["Mein Bauch tut nicht mehr weh! Mama sagt: keine gr\xFCnen \xC4pfel mehr.","Ich habe Opa beim \xC4pfelpfl\xFCcken geholfen \u2013 und nur reife gegessen! Hier, f\xFCr dich."],["Meine Stimme ist zur\xFCck! H\xF6r mal\u2026 la-la-laaa! Danke!","Ich habe ein Lied \xFCber deinen Laden geschrieben. Die ganze Sch\xE4nke singt es!"],["Meine Haut brennt nicht mehr. Die L\xE4mmer und ich danken dir!","Jetzt nehme ich deine Salbe mit auf die Hochweiden. Den ganzen Sommer kein Sonnenbrand!"],["Letzte Nacht keine b\xF6sen Tr\xE4ume \u2013 nur Sterne und Stille. Danke.","Nach jeder Wache schlafe ich jetzt s\xFC\xDF. Die ganze Stra\xDFe ist dadurch sicherer!"],["Das Fieber ist weg, und meine Schmiede ist wieder warm! Danke.","Ich habe dir einen Haken f\xFCr deine Kr\xE4uter geschmiedet. Stark wie meine neue Gesundheit!"]]},es:{title:"AMISTAD",ask:"\xBFMe a\xF1ades tambi\xE9n {herb}, por favor?",more:"Ya eres como de la familia. \xA1Acepta esto, por favor!",ch:[["\xA1Por fin dorm\xED hasta el amanecer! Volver\xE9 pronto.","Ahora duermo como un gato junto a la estufa. \xA1Nadie prepara pociones como t\xFA!"],["\xA1Ya no me duelen los ojos y puedo leer mis cartas! Gracias.","Ahora coso incluso a la luz de una vela. \xA1Mi hija tendr\xE1 vestido nuevo!"],["\xA1Volvieron los colores! Hasta la lluvia se ve bonita hoy.","Aqu\xED tienes un dibujo de tu tienda, con todas sus flores. Lo colgar\xE9 junto a mi puerta."],["\xA1Ni una tos en toda la noche! Mi familia te lo agradece.","\xA1El domingo cant\xE9 en el coro sin toser ni una vez! Todos preguntan por ti."],["Por primera vez en mucho tiempo estoy en calma. Qu\xE9 tienda tan bonita.","\xA1Habl\xE9 en la asamblea del pueblo y no me temblaron las manos! Gracias, amigo."],["\xA1Vuelvo a tener fuerzas para el camino! Te traer\xE9 historias de tierras lejanas.","Cruc\xE9 las monta\xF1as con tu tintura. \xA1Te traje semillas del otro lado!"],["Ya siento el coraz\xF3n m\xE1s ligero. Quiz\xE1 escriba una carta nueva\u2026","\xA1Me respondi\xF3! Vamos juntos a la feria. \xA1Gracias!"],["\xA1Ya no me duele la barriga! Mam\xE1 dice que se acabaron las manzanas verdes.","\xA1Ayud\xE9 al abuelo a recoger manzanas y solo com\xED las maduras! Toma, para ti."],["\xA1Recuper\xE9 la voz! Escucha\u2026 \xA1la-la-laaa! \xA1Gracias!","Compuse una canci\xF3n sobre tu tienda. \xA1Ahora la canta toda la taberna!"],["Ya no me arde la piel. \xA1Los corderitos y yo te lo agradecemos!","Ahora llevo tu ung\xFCento a los prados altos. \xA1Ni una quemadura en todo el verano!"],["Anoche, ni una pesadilla: solo estrellas y calma. Gracias.","Ahora duermo pl\xE1cidamente tras cada guardia. \xA1Toda la calle est\xE1 m\xE1s segura!"],["\xA1Se fue la fiebre y mi fragua vuelve a estar caliente! Gracias.","Te forj\xE9 un ganchito para tus hierbas. \xA1Fuerte como mi nueva salud!"]]},fr:{title:"AMITI\xC9",ask:"Et tu peux ajouter ceci : {herb} ?",more:"Tu fais presque partie de la famille. Prends ceci, s\u2019il te pla\xEEt !",ch:[["Enfin une nuit compl\xE8te jusqu\u2019\xE0 l\u2019aube ! Je reviendrai.","Je dors comme un chat pr\xE8s du po\xEAle. Personne ne fait de potions comme toi !"],["Mes yeux ne me font plus mal, je relis mes lettres ! Merci.","Je couds m\xEAme \xE0 la bougie maintenant. Ma fille aura une robe neuve !"],["Les couleurs sont revenues ! M\xEAme la pluie est jolie aujourd\u2019hui.","Voici un dessin de ta boutique, avec toutes ses fleurs. Il sera accroch\xE9 \xE0 ma porte."],["Pas une seule toux de la nuit ! Toute ma famille te remercie.","Dimanche, j\u2019ai chant\xE9 \xE0 la chorale sans tousser une fois ! Tout le monde parle de toi."],["Pour la premi\xE8re fois depuis longtemps, je suis calme. Quelle jolie boutique.","J\u2019ai parl\xE9 \xE0 l\u2019assembl\xE9e du village sans trembler ! Merci, l\u2019ami."],["J\u2019ai de nouveau la force de partir ! Je te rapporterai des histoires lointaines.","J\u2019ai travers\xE9 les montagnes gr\xE2ce \xE0 ta teinture. Voici des graines de l\u2019autre versant !"],["J\u2019ai d\xE9j\xE0 le c\u0153ur plus l\xE9ger. Je vais peut-\xEAtre \xE9crire une nouvelle lettre\u2026","Il m\u2019a r\xE9pondu ! Nous allons \xE0 la foire ensemble. Merci !"],["Je n\u2019ai plus mal au ventre ! Maman dit : fini les pommes vertes.","J\u2019ai aid\xE9 Papi \xE0 cueillir les pommes, et je n\u2019ai mang\xE9 que les m\xFBres ! Tiens, c\u2019est pour toi."],["Ma voix est revenue ! \xC9coute\u2026 la-la-laaa ! Merci !","J\u2019ai \xE9crit une chanson sur ta boutique. Toute la taverne la chante !"],["Ma peau ne br\xFBle plus. Les agneaux et moi te remercions !","J\u2019emporte ton baume dans les alpages. Pas un coup de soleil de tout l\u2019\xE9t\xE9 !"],["Pas un cauchemar cette nuit, juste des \xE9toiles et le calme. Merci.","Je dors paisiblement apr\xE8s chaque ronde. Toute la rue est plus s\xFBre !"],["La fi\xE8vre est partie et ma forge est de nouveau chaude ! Merci.","Je t\u2019ai forg\xE9 un crochet pour tes herbes. Solide comme ma sant\xE9 retrouv\xE9e !"]]},it:{title:"AMICIZIA",ask:"Puoi aggiungere anche questo: {herb}?",more:"Ormai sei come di famiglia. Accetta questo, ti prego!",ch:[["Finalmente ho dormito fino all\u2019alba! Torner\xF2 presto.","Ora dormo come un gatto vicino alla stufa. Nessuno prepara pozioni come te!"],["Gli occhi non mi fanno pi\xF9 male, rileggo le mie lettere! Grazie.","Ora cucio perfino a lume di candela. Mia figlia avr\xE0 un vestito nuovo!"],["Sono tornati i colori! Perfino la pioggia oggi \xE8 bella.","Ecco un disegno della tua bottega, con tutti i fiori. Lo appender\xF2 alla mia porta."],["Nemmeno un colpo di tosse tutta la notte! La mia famiglia ti ringrazia.","Domenica ho cantato nel coro senza mai tossire! Tutti chiedono di te."],["Per la prima volta da tanto mi sento in pace. Che bella bottega.","Ho parlato all\u2019assemblea del paese e le mani non mi tremavano! Grazie, amico."],["Ho di nuovo la forza per il viaggio! Ti porter\xF2 storie da terre lontane.","Ho attraversato le montagne con la tua tintura. Ecco dei semi dall\u2019altro versante!"],["Ho gi\xE0 il cuore pi\xF9 leggero. Forse scriver\xF2 una nuova lettera\u2026","Mi ha risposto! Andiamo insieme alla fiera. Grazie!"],["Non mi fa pi\xF9 male la pancia! La mamma dice: basta mele verdi.","Ho aiutato il nonno a raccogliere le mele e ho mangiato solo quelle mature! Tieni, \xE8 per te."],["Mi \xE8 tornata la voce! Ascolta\u2026 la-la-laaa! Grazie!","Ho scritto una canzone sulla tua bottega. Ora la canta tutta la taverna!"],["La pelle non mi brucia pi\xF9. Gli agnellini e io ti ringraziamo!","Ora porto il tuo unguento sui pascoli alti. Nemmeno una scottatura per tutta l\u2019estate!"],["Stanotte niente incubi, solo stelle e silenzio. Grazie.","Ora dopo ogni ronda dormo sereno. Tutta la via \xE8 pi\xF9 sicura!"],["La febbre \xE8 passata e la mia fucina \xE8 di nuovo calda! Grazie.","Ti ho forgiato un gancio per le erbe. Forte come la mia salute ritrovata!"]]},pl:{title:"PRZYJA\u0179\u0143",ask:"Dodasz jeszcze to: {herb}?",more:"Jeste\u015B dla mnie jak rodzina. Prosz\u0119, przyjmij to!",ch:[["Wreszcie \u015Bpi\u0119 a\u017C do \u015Bwitu! Jeszcze tu wr\xF3c\u0119.","Teraz \u015Bpi\u0119 jak kot przy piecu. Nikt nie warzy mikstur tak jak ty!"],["Oczy ju\u017C nie bol\u0105 \u2014 zn\xF3w czytam listy! Dzi\u0119kuj\u0119.","Teraz szyj\u0119 nawet przy \u015Bwiecy. C\xF3rka dostanie now\u0105 sukienk\u0119!"],["Kolory wr\xF3ci\u0142y! Nawet deszcz jest dzi\u015B pi\u0119kny.","Oto rysunek twojego sklepu, ze wszystkimi kwiatami. Zawi\u015Bnie przy moich drzwiach."],["Ani jednego kaszlni\u0119cia przez ca\u0142\u0105 noc! Ca\u0142a rodzina ci dzi\u0119kuje.","W niedziel\u0119 \u015Bpiewam w ch\xF3rze \u2014 bez kaszlu! Wszyscy o ciebie pytaj\u0105."],["Pierwszy raz od dawna czuj\u0119 spok\xF3j. Jaki pi\u0119kny sklepik.","Przemowa na zebraniu miasta \u2014 i r\u0119ce ani drgn\u0119\u0142y! Dzi\u0119kuj\u0119, przyjacielu."],["Zn\xF3w mam si\u0142\u0119 na drog\u0119! Przywioz\u0119 ci opowie\u015Bci z dalekich stron.","Dzi\u0119ki twojej nalewce g\xF3ry s\u0105 za mn\u0105. Oto nasiona z drugiej strony!"],["Ju\u017C mi l\u017Cej na sercu. Mo\u017Ce napisz\u0119 nowy list\u2026","Odpisa\u0142! Idziemy razem na jarmark. Dzi\u0119kuj\u0119!"],["Brzuszek ju\u017C nie boli! Mama m\xF3wi: koniec z zielonymi jab\u0142kami.","Pomog\u0142em dziadkowi zbiera\u0107 jab\u0142ka i jad\u0142em tylko dojrza\u0142e! To dla ciebie."],["G\u0142os wr\xF3ci\u0142! Pos\u0142uchaj\u2026 la-la-laaa! Dzi\u0119kuj\u0119!","U\u0142o\u017Cy\u0142em piosenk\u0119 o twoim sklepie. Teraz \u015Bpiewa j\u0105 ca\u0142a karczma!"],["Sk\xF3ra ju\u017C nie piecze. Owieczki i ja dzi\u0119kujemy!","Teraz zabieram twoj\u0105 ma\u015B\u0107 na wysokie hale. Ani jednego oparzenia przez ca\u0142e lato!"],["Tej nocy \u017Cadnych koszmar\xF3w \u2014 tylko gwiazdy i cisza. Dzi\u0119kuj\u0119.","Po ka\u017Cdej warcie \u015Bpi\u0119 teraz s\u0142odko. Ca\u0142a ulica jest przez to bezpieczniejsza!"],["Gor\u0105czka min\u0119\u0142a, a moja ku\u017Ania zn\xF3w jest ciep\u0142a! Dzi\u0119kuj\u0119.","Wyku\u0142am ci haczyk na zio\u0142a. Mocny jak moje nowe zdrowie!"]]},pt:{title:"AMIZADE",ask:"Pode colocar tamb\xE9m: {herb}?",more:"Voc\xEA j\xE1 \xE9 como da fam\xEDlia. Aceite isto, por favor!",ch:[["Finalmente dormi at\xE9 o amanhecer! Vou voltar.","Agora durmo como um gato perto do fog\xE3o. Ningu\xE9m faz po\xE7\xF5es como voc\xEA!"],["Meus olhos pararam de doer, j\xE1 leio minhas cartas! Obrigado.","Agora costuro at\xE9 \xE0 luz de vela. Minha filha vai ganhar um vestido novo!"],["As cores voltaram! At\xE9 a chuva est\xE1 bonita hoje.","Aqui est\xE1 um desenho da sua loja, com todas as flores. Vai ficar na minha porta."],["Nem uma tossida a noite toda! Minha fam\xEDlia agradece.","No domingo cantei no coral sem tossir nenhuma vez! Todos perguntam por voc\xEA."],["Pela primeira vez em muito tempo, sinto paz. Que lojinha linda.","Falei na reuni\xE3o da cidade e minhas m\xE3os nem tremeram! Obrigado, amigo."],["Tenho for\xE7as para a estrada de novo! Vou trazer hist\xF3rias de terras distantes.","Atravessei as montanhas com a sua tintura. Trouxe sementes do outro lado!"],["Meu cora\xE7\xE3o j\xE1 est\xE1 mais leve. Talvez eu escreva uma nova carta\u2026","Ele respondeu! Vamos juntos \xE0 feira. Obrigada!"],["Minha barriga parou de doer! Mam\xE3e diz: chega de ma\xE7\xE3s verdes.","Ajudei o vov\xF4 a colher ma\xE7\xE3s e s\xF3 comi as maduras! Toma, \xE9 pra voc\xEA."],["Minha voz voltou! Escuta\u2026 l\xE1-l\xE1-l\xE1aa! Obrigado!","Compus uma can\xE7\xE3o sobre a sua loja. Agora a taverna inteira canta!"],["Minha pele n\xE3o arde mais. Os cordeirinhos e eu agradecemos!","Agora levo sua pomada para os pastos altos. Nem uma queimadura o ver\xE3o todo!"],["Nenhum pesadelo esta noite, s\xF3 estrelas e sil\xEAncio. Obrigado.","Agora durmo tranquilo depois de cada ronda. A rua toda ficou mais segura!"],["A febre passou e minha forja est\xE1 quente de novo! Obrigada.","Forjei um ganchinho para as suas ervas. Forte como a minha nova sa\xFAde!"]]},id:{title:"PERSAHABATAN",ask:"Bisa tambahkan ini juga: {herb}?",more:"Kamu sudah seperti keluarga bagiku. Terimalah ini, ya!",ch:[["Akhirnya aku tidur nyenyak sampai pagi! Aku pasti kembali.","Sekarang aku tidur seperti kucing di dekat tungku. Tak ada yang meracik ramuan sepertimu!"],["Mataku tak sakit lagi, aku bisa membaca surat lagi! Terima kasih.","Sekarang aku bisa menjahit di bawah cahaya lilin. Putriku akan punya gaun baru!"],["Warnanya kembali! Bahkan hujan pun terlihat indah hari ini.","Ini gambar tokomu, lengkap dengan bunganya. Akan kugantung di dekat pintuku."],["Tak sekali pun batuk semalaman! Keluargaku berterima kasih.","Hari Minggu aku bernyanyi di paduan suara tanpa batuk! Semua orang menanyakanmu."],["Untuk pertama kalinya setelah sekian lama, aku merasa tenang. Toko yang indah sekali.","Aku bicara di rapat desa dan tanganku tidak gemetar! Terima kasih, kawan."],["Aku kuat lagi untuk berkelana! Akan kubawakan cerita dari negeri jauh.","Aku menyeberangi pegunungan dengan tingturmu. Ini benih dari seberang sana!"],["Hatiku sudah terasa lebih ringan. Mungkin aku akan menulis surat baru\u2026","Dia membalas suratku! Kami akan ke pasar malam bersama. Terima kasih!"],["Perutku tidak sakit lagi! Kata Ibu, tak ada lagi apel hijau.","Aku membantu Kakek memetik apel dan hanya makan yang matang! Ini untukmu."],["Suaraku kembali! Dengar\u2026 la-la-laaa! Terima kasih!","Aku menciptakan lagu tentang tokomu. Sekarang seisi kedai menyanyikannya!"],["Kulitku tak perih lagi. Domba-domba kecil dan aku berterima kasih!","Sekarang kubawa salepmu ke padang rumput tinggi. Tak sekali pun terbakar sepanjang musim panas!"],["Semalam tak ada mimpi buruk, hanya bintang dan sunyi. Terima kasih.","Kini aku tidur nyenyak setiap selesai berjaga. Seluruh jalan jadi lebih aman!"],["Demamnya hilang, dan tempaanku hangat lagi! Terima kasih.","Kutempa pengait kecil untuk tanaman herbalmu. Kuat seperti kesehatanku yang baru!"]]},nl:{title:"VRIENDSCHAP",ask:"Doe je er ook dit bij: {herb}?",more:"Je bent haast familie. Neem dit alsjeblieft aan!",ch:[["Eindelijk geslapen tot zonsopgang! Ik kom terug.","Nu slaap ik als een kat bij de kachel. Niemand brouwt zoals jij!"],["Mijn ogen doen geen pijn meer, ik lees mijn brieven weer! Bedankt.","Nu naai ik zelfs bij kaarslicht. Mijn dochter krijgt een nieuwe jurk!"],["De kleuren zijn terug! Zelfs de regen is vandaag mooi.","Hier is een tekening van je winkel, met alle bloemen. Hij hangt straks bij mijn deur."],["De hele nacht geen kuchje! Mijn familie bedankt je.","Zondag zong ik in het koor zonder \xE9\xE9n keer te hoesten! Iedereen vraagt naar je."],["Voor het eerst in lange tijd voel ik me rustig. Wat een fijn winkeltje.","Ik sprak op de dorpsvergadering en mijn handen trilden niet! Dank je, vriend."],["Ik heb weer kracht voor de reis! Ik breng je verhalen uit verre landen mee.","Met jouw tinctuur trok ik over de bergen. Hier, zaden van de overkant!"],["Mijn hart voelt al lichter. Misschien schrijf ik een nieuwe brief\u2026","Hij schreef terug! We gaan samen naar de kermis. Dank je!"],["Mijn buik doet geen pijn meer! Mama zegt: geen groene appels meer.","Ik hielp opa appels plukken en at alleen rijpe! Hier, voor jou."],["Mijn stem is terug! Luister\u2026 la-la-laaa! Dank je!","Ik schreef een lied over je winkel. De hele herberg zingt het nu!"],["Mijn huid prikt niet meer. De lammetjes en ik danken je!","Nu neem ik je zalf mee naar de hoge weiden. De hele zomer geen verbranding!"],["Vannacht geen nare dromen, alleen sterren en stilte. Dank je.","Na elke wacht slaap ik nu heerlijk. De hele straat is er veiliger door!"],["De koorts is weg en mijn smidse is weer warm! Dank je.","Ik smeedde een haakje voor je kruiden. Sterk als mijn nieuwe gezondheid!"]]},tr:{title:"DOSTLUK",ask:"\u015Eunu da ekler misin: {herb}?",more:"Art\u0131k ailem gibisin. L\xFCtfen bunu kabul et!",ch:[["Sonunda sabaha kadar uyudum! Yine gelece\u011Fim.","Art\u0131k soban\u0131n yan\u0131ndaki kedi gibi uyuyorum. Senin gibi iksir yapan yok!"],["G\xF6zlerim art\u0131k a\u011Fr\u0131m\u0131yor, mektuplar\u0131m\u0131 yine okuyorum! Te\u015Fekk\xFCrler.","Art\u0131k mum \u0131\u015F\u0131\u011F\u0131nda bile diki\u015F dikiyorum. K\u0131z\u0131m\u0131n yeni elbisesi olacak!"],["Renkler geri geldi! Bug\xFCn ya\u011Fmur bile g\xFCzel.","\u0130\u015Fte b\xFCt\xFCn \xE7i\xE7ekleriyle d\xFCkk\xE2n\u0131n\u0131n resmi. Kap\u0131m\u0131n yan\u0131na asaca\u011F\u0131m."],["B\xFCt\xFCn gece tek bir \xF6ks\xFCr\xFCk yok! Ailem sana te\u015Fekk\xFCr ediyor.","Pazar g\xFCn\xFC korda hi\xE7 \xF6ks\xFCrmeden \u015Fark\u0131 s\xF6yledim! Herkes seni soruyor."],["Uzun zamand\u0131r ilk kez huzurluyum. Ne g\xFCzel bir d\xFCkk\xE2n.","Kasaba toplant\u0131s\u0131nda konu\u015Ftum ve ellerim hi\xE7 titremedi! Te\u015Fekk\xFCrler dostum."],["Yola \xE7\u0131kacak g\xFCc\xFCm yine var! Sana uzak diyarlardan hik\xE2yeler getirece\u011Fim.","Tent\xFCr\xFCn sayesinde da\u011Flar\u0131 a\u015Ft\u0131m. \u0130\u015Fte \xF6b\xFCr taraftan tohumlar!"],["Kalbim \u015Fimdiden hafifledi. Belki yeni bir mektup yazar\u0131m\u2026","Bana cevap yazd\u0131! Panay\u0131ra birlikte gidiyoruz. Te\u015Fekk\xFCrler!"],["Karn\u0131m art\u0131k a\u011Fr\u0131m\u0131yor! Annem art\u0131k ye\u015Fil elma yok diyor.","Dedeme elma toplamada yard\u0131m ettim, sadece olgunlar\u0131 yedim! Al, bu senin."],["Sesim geri geldi! Dinle\u2026 la-la-laaa! Te\u015Fekk\xFCrler!","D\xFCkk\xE2n\u0131n hakk\u0131nda bir \u015Fark\u0131 yazd\u0131m. Art\u0131k b\xFCt\xFCn han onu s\xF6yl\xFCyor!"],["Tenim art\u0131k yanm\u0131yor. Kuzucuklar ve ben sana te\u015Fekk\xFCr ediyoruz!","Art\u0131k merhemini y\xFCksek yaylalara g\xF6t\xFCr\xFCyorum. B\xFCt\xFCn yaz tek bir yan\u0131k yok!"],["D\xFCn gece hi\xE7 k\xE2bus yok, sadece y\u0131ld\u0131zlar ve sessizlik. Te\u015Fekk\xFCrler.","Art\u0131k her n\xF6betten sonra tatl\u0131 tatl\u0131 uyuyorum. B\xFCt\xFCn sokak daha g\xFCvende!"],["Ate\u015Fim d\xFC\u015Ft\xFC, demirhanem yine s\u0131cak! Te\u015Fekk\xFCrler.","Otlar\u0131n i\xE7in k\xFC\xE7\xFCk bir kanca d\xF6vd\xFCm. Yeni sa\u011Fl\u0131\u011F\u0131m kadar sa\u011Flam!"]]},vi:{title:"T\xCCNH B\u1EA0N",ask:"B\u1EA1n th\xEAm gi\xFAp t\xF4i c\u1EA3 th\u1EE9 n\xE0y nh\xE9: {herb}?",more:"Gi\u1EDD b\u1EA1n nh\u01B0 ng\u01B0\u1EDDi nh\xE0 c\u1EE7a t\xF4i r\u1ED3i. Xin h\xE3y nh\u1EADn l\u1EA5y!",ch:[["Cu\u1ED1i c\xF9ng t\xF4i \u0111\xE3 ng\u1EE7 m\u1ED9t m\u1EA1ch t\u1EDBi s\xE1ng! T\xF4i s\u1EBD quay l\u1EA1i.","Gi\u1EDD t\xF4i ng\u1EE7 ngon nh\u01B0 m\xE8o n\u1EB1m c\u1EA1nh b\u1EBFp. Kh\xF4ng ai pha thu\u1ED1c gi\u1ECFi b\u1EB1ng b\u1EA1n!"],["M\u1EAFt t\xF4i h\u1EBFt \u0111au r\u1ED3i, t\xF4i l\u1EA1i \u0111\u1ECDc \u0111\u01B0\u1EE3c th\u01B0! C\u1EA3m \u01A1n b\u1EA1n.","Gi\u1EDD t\xF4i may \u0111\u01B0\u1EE3c c\u1EA3 d\u01B0\u1EDBi \xE1nh n\u1EBFn. Con g\xE1i t\xF4i s\u1EAFp c\xF3 v\xE1y m\u1EDBi!"],["M\xE0u s\u1EAFc \u0111\xE3 tr\u1EDF l\u1EA1i! H\xF4m nay \u0111\u1EBFn m\u01B0a c\u0169ng th\u1EADt \u0111\u1EB9p.","\u0110\xE2y l\xE0 b\u1EE9c v\u1EBD c\u1EEDa h\xE0ng c\u1EE7a b\u1EA1n, \u0111\u1EE7 c\u1EA3 hoa. T\xF4i s\u1EBD treo n\xF3 c\u1EA1nh c\u1EEDa nh\xE0 m\xECnh."],["C\u1EA3 \u0111\xEAm kh\xF4ng ho m\u1ED9t ti\u1EBFng n\xE0o! C\u1EA3 nh\xE0 t\xF4i c\u1EA3m \u01A1n b\u1EA1n.","Ch\u1EE7 nh\u1EADt t\xF4i h\xE1t trong d\xE0n \u0111\u1ED3ng ca m\xE0 kh\xF4ng ho l\u1EA7n n\xE0o! Ai c\u0169ng h\u1ECFi v\u1EC1 b\u1EA1n."],["L\xE2u l\u1EAFm r\u1ED3i t\xF4i m\u1EDBi th\u1EA5y b\xECnh y\xEAn. C\u1EEDa h\xE0ng xinh qu\xE1.","T\xF4i ph\xE1t bi\u1EC3u \u1EDF bu\u1ED5i h\u1ECDp l\xE0ng m\xE0 tay kh\xF4ng run ch\xFAt n\xE0o! C\u1EA3m \u01A1n b\u1EA1n hi\u1EC1n."],["T\xF4i l\u1EA1i \u0111\u1EE7 s\u1EE9c l\xEAn \u0111\u01B0\u1EDDng r\u1ED3i! T\xF4i s\u1EBD mang v\u1EC1 cho b\u1EA1n chuy\u1EC7n t\u1EEB ph\u01B0\u01A1ng xa.","Nh\u1EDD c\u1ED3n thu\u1ED1c c\u1EE7a b\u1EA1n, t\xF4i \u0111\xE3 v\u01B0\u1EE3t qua n\xFAi. \u0110\xE2y l\xE0 h\u1EA1t gi\u1ED1ng t\u1EEB b\xEAn kia!"],["L\xF2ng t\xF4i \u0111\xE3 nh\u1EB9 nh\xF5m h\u01A1n r\u1ED3i. C\xF3 l\u1EBD t\xF4i s\u1EBD vi\u1EBFt m\u1ED9t l\xE1 th\u01B0 m\u1EDBi\u2026","Anh \u1EA5y \u0111\xE3 h\u1ED3i \xE2m! Ch\xFAng t\xF4i s\u1EBD c\xF9ng \u0111i h\u1ED9i ch\u1EE3. C\u1EA3m \u01A1n b\u1EA1n!"],["B\u1EE5ng ch\xE1u h\u1EBFt \u0111au r\u1ED3i! M\u1EB9 b\u1EA3o kh\xF4ng \u0103n t\xE1o xanh n\u1EEFa \u0111\xE2u.","Ch\xE1u gi\xFAp \xF4ng h\xE1i t\xE1o v\xE0 ch\u1EC9 \u0103n qu\u1EA3 ch\xEDn th\xF4i! C\xE1i n\xE0y t\u1EB7ng b\u1EA1n."],["Gi\u1ECDng t\xF4i \u0111\xE3 tr\u1EDF l\u1EA1i! Nghe n\xE0y\u2026 la-la-laaa! C\u1EA3m \u01A1n b\u1EA1n!","T\xF4i \u0111\xE3 vi\u1EBFt m\u1ED9t b\xE0i h\xE1t v\u1EC1 c\u1EEDa h\xE0ng c\u1EE7a b\u1EA1n. Gi\u1EDD c\u1EA3 qu\xE1n tr\u1ECD \u0111\u1EC1u h\xE1t!"],["Da t\xF4i h\u1EBFt r\xE1t r\u1ED3i. B\u1EA7y c\u1EEBu non v\xE0 t\xF4i c\u1EA3m \u01A1n b\u1EA1n!","Gi\u1EDD t\xF4i mang thu\u1ED1c m\u1EE1 c\u1EE7a b\u1EA1n l\xEAn \u0111\u1ED3ng c\u1ECF cao. C\u1EA3 m\xF9a h\xE8 kh\xF4ng b\u1ECB ch\xE1y n\u1EAFng l\u1EA7n n\xE0o!"],["\u0110\xEAm qua kh\xF4ng c\xF2n \xE1c m\u1ED9ng, ch\u1EC9 c\xF3 sao v\xE0 t\u0129nh l\u1EB7ng. C\u1EA3m \u01A1n b\u1EA1n.","Gi\u1EDD sau m\u1ED7i ca g\xE1c t\xF4i ng\u1EE7 th\u1EADt ngon. C\u1EA3 con ph\u1ED1 c\u0169ng an to\xE0n h\u01A1n!"],["H\u1EBFt s\u1ED1t r\u1ED3i, l\xF2 r\xE8n c\u1EE7a t\xF4i l\u1EA1i \u1EA5m \xE1p! C\u1EA3m \u01A1n b\u1EA1n.","T\xF4i \u0111\xE3 r\xE8n cho b\u1EA1n m\u1ED9t c\xE1i m\xF3c treo th\u1EA3o d\u01B0\u1EE3c. Ch\u1EAFc kh\u1ECFe nh\u01B0 s\u1EE9c kh\u1ECFe m\u1EDBi c\u1EE7a t\xF4i!"]]},ko:{title:"\uC6B0\uC815",ask:"\uC774\uAC83\uB3C4 \uB123\uC5B4 \uC8FC\uC2E4\uB798\uC694? {herb}",more:"\uC774\uC81C \uAC00\uC871 \uAC19\uC544\uC694. \uC774\uAC70 \uAF2D \uBC1B\uC544 \uC8FC\uC138\uC694!",ch:[["\uB4DC\uB514\uC5B4 \uC544\uCE68\uAE4C\uC9C0 \uD479 \uC7A4\uC5B4\uC694! \uB610 \uC62C\uAC8C\uC694.","\uC774\uC81C \uB09C\uB85C \uC606 \uACE0\uC591\uC774\uCC98\uB7FC \uC790\uC694. \uB2F9\uC2E0\uB9CC\uD07C \uBB3C\uC57D\uC744 \uC798 \uB9CC\uB4DC\uB294 \uC0AC\uB78C\uC740 \uC5C6\uC5B4\uC694!"],["\uB208\uC774 \uB354\uB294 \uC548 \uC544\uD30C\uC694. \uB2E4\uC2DC \uD3B8\uC9C0\uB97C \uC77D\uC744 \uC218 \uC788\uC5B4\uC694! \uACE0\uB9C8\uC6CC\uC694.","\uC774\uC81C \uCD1B\uBD88 \uC544\uB798\uC11C\uB3C4 \uBC14\uB290\uC9C8\uD574\uC694. \uB538\uC5D0\uAC8C \uC0C8 \uC637\uC744 \uC9C0\uC5B4 \uC904 \uAC70\uC608\uC694!"],["\uC0C9\uC774 \uB3CC\uC544\uC654\uC5B4\uC694! \uC624\uB298\uC740 \uBE44\uB9C8\uC800 \uC608\uBED0\uC694.","\uAF43\uAE4C\uC9C0 \uB2E4 \uAD
