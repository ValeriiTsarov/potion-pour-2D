<!DOCTYPE html>

    <script>
        // Boot error catcher: show errors on screen (mobile has no console). Watchdog: game.ts sets __booted.
        (function () {
            function show(msg) {
                var d = document.getElementById('boot-err');
                if (!d) {
                    d = document.createElement('div');
                    d.id = 'boot-err';
                    d.style.cssText = 'position:fixed;left:0;right:0;top:0;padding:12px;background:#a00;color:#fff;font:14px monospace;white-space:pre-wrap;z-index:9999';
                    (document.body || document.documentElement).appendChild(d);
                }
                d.textContent += msg + '\n';
            }
            window.onerror = function (m, src, line) { show('Error: ' + m + ' (' + src + ':' + line + ')'); };
            // Capture phase: resource load errors (<script>/<img>) don't bubble and never reach onerror.
            window.addEventListener('error', function (e) {
                var t = e.target;
                if (t && t !== window && (t.src || t.href)) show('Failed to load: ' + (t.src || t.href));
            }, true);
            window.addEventListener('unhandledrejection', function (e) { show('Promise: ' + (e.reason && e.reason.message || e.reason)); });
            setTimeout(function () { if (!window.__booted) show('Game did not start in 8 s. Try reloading.'); }, 8000);
            // Space / arrows must not scroll a portal host page. After boot Phaser's keyboard captures do it:
            // Phaser ignores events that are already defaultPrevented, so we must step aside.
            window.addEventListener('keydown', function (e) {
                if (window.__booted) return;
                if (e.code === 'Space' || e.code.indexOf('Arrow') === 0) e.preventDefault();
            });
        })();
    </script>

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { width: 100%; height: 100%; }
        body { background: #0a0a2a; overflow: hidden; touch-action: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; display: flex; align-items: center; justify-content: center; }
        #game { width: 100%; height: 100vh; height: 100dvh; flex: none; }
        /* Loading screen (as Antfall's): the logo bobbing till the lab is up (play.ts create fades it out). */
        #splash { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; background: #0a0a2a; z-index: 10; transition: opacity 0.4s; }
        #splash img { width: min(80vw, 700px); animation: bob 1.6s ease-in-out infinite; }
        @keyframes bob { 50% { transform: translateY(-2%) scale(1.02); } }
        /* Progress bar (Poki Easy Access: a bar, or players take the load for a freeze and leave). */
        #splash { flex-direction: column; gap: 4vh; }
        #bar { width: min(60vw, 420px); height: 12px; border-radius: 6px; background: #45293f; overflow: hidden; }
        #bar i { display: block; height: 100%; width: 3%; border-radius: 6px; background: #f9c22b; transition: width 0.3s; }
        /* Waiting for lazyArt on the way to the room / garden (hud.ts waitArt, as Antfall's #wait): a ring, no words. */
        #wait { position: fixed; left: 50%; top: 50%; width: 48px; height: 48px; margin: -24px; box-sizing: border-box; border: 5px solid #45293f; border-top-color: #f9c22b; border-radius: 50%; animation: spin 0.9s linear infinite; z-index: 10; }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>

    // loader drives 45 → 100 % through window.__splash(p). It never goes back.
    (function () {
        var p = 0.03, el = document.querySelector('#bar i');
        var set = function (v) { if (v > p) { p = v; el.style.width = (p * 100).toFixed(1) + '%'; } };
        var creep = setInterval(function () { if (p >= 0.44) clearInterval(creep); else set(p + (0.45 - p) * 0.04); }, 100);
        window.__splash = function (v) { clearInterval(creep); set(v); };
    })();
